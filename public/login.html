<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to DSA Mastery</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.mark{width:48px;height:48px;border-radius:16px;background:var(--ink);color:white;display:grid;place-items:center;font-size:23px;margin-bottom:22px}.login-card h1{font-size:28px;letter-spacing:-.05em;margin:0 0 8px}.login-card p{font-size:13px;color:var(--muted);line-height:1.6}.login-card input{width:100%;border:1px solid var(--line);background:#fffaf3;border-radius:12px;padding:13px;margin:9px 0;color:var(--ink)}.login-card button{width:100%;border:0;border-radius:12px;padding:13px;background:var(--mocha);color:white;font-weight:750;margin-top:8px}.login-card .quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}[hidden]{display:none!important}.msg{min-height:20px;color:var(--muted);font-size:12px}.msg.err{color:#B0492E}</style></head><body><main class="login-card"><div class="mark">⑂</div><div class="eyebrow">Your personal learning universe</div><h1 id="title">Welcome back.</h1><p id="sub">Sign in with your email. We'll send you a one-time code — no password needed.</p><form id="form"><div id="email-row"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required></div><div id="code-row" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="submit">Continue</button><button type="button" id="back" class="quiet" hidden>Use another email</button></form><div id="passkey" hidden><p>Add a passkey to sign in next time with your fingerprint, face, or device screen lock.</p><button type="button" id="passkey-add">Add a passkey</button><button type="button" id="passkey-skip" class="quiet">Not now</button></div><p class="msg" id="msg" role="status"></p></main><script>(function(){var A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailRow=document.getElementById('email-row'),codeRow=document.getElementById('code-row'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),passkey=document.getElementById('passkey'),hasPasskey=false,step='email';function say(t,e){msg.textContent=t||'';msg.className='msg '+(e?'err':'')}function next(){var n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.charAt(0)==='/'&&n.charAt(1)!=='/'?n:'/')}function finish(){if(hasPasskey||localStorage.getItem('dsa-passkey-declined')==='1'||!A.supportsPasskeys||!A.supportsPasskeys()){next();return}form.hidden=true;passkey.hidden=false;document.getElementById('title').textContent='You are signed in';document.getElementById('sub').textContent='Make your next visit effortless.'}if(!A){say('Sign-in is not available. Refresh and try again.',true);return}A.getSession().then(function(s){if(s&&s.user)next()}).catch(function(){});back.onclick=function(){step='email';emailRow.hidden=false;codeRow.hidden=true;back.hidden=true;submit.textContent='Continue';say('')};form.onsubmit=function(e){e.preventDefault();submit.disabled=true;if(step==='email'){A.startLogin({email:email.value.trim()}).then(function(r){hasPasskey=!!r.has_passkey;step='code';emailRow.hidden=true;codeRow.hidden=false;back.hidden=false;submit.textContent='Sign in';document.getElementById('sub').textContent='Enter the code sent to '+email.value.trim();code.focus();say('Code sent. Check your inbox.')}).catch(function(x){say(x.message||'Could not send code.',true)}).then(function(){submit.disabled=false})}else{A.verifyCode({email:email.value.trim(),code:code.value.trim()}).then(finish).catch(function(x){say(x.message||'That code did not work.',true)}).then(function(){submit.disabled=false})}};document.getElementById('passkey-add').onclick=function(){A.registerPasskey().then(function(){next()}).catch(function(x){say(x.message||'Could not add passkey.',true)})};document.getElementById('passkey-skip').onclick=function(){localStorage.setItem('dsa-passkey-declined','1');next()}})()</script></body></html>
